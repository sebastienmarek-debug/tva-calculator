<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facturation — Outils de Counie</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f7; color: #1d1d1f; }

    header {
      background: white; padding: 1.5rem 2rem;
      display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
      border-bottom: 1px solid #e5e5ea; box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      position: relative;
    }
    header img { height: 70px; object-fit: contain; }
    header h1 { font-size: 1.25rem; font-weight: 700; color: #1d1d1f; }
    header h1 span { color: #c0748a; }
    .back-link { position: absolute; left: 2rem; top: 50%; transform: translateY(-50%); text-decoration: none; color: #6e6e73; font-size: 0.85rem; display: flex; align-items: center; gap: 0.3rem; }
    .back-link:hover { color: #1d1d1f; }

    .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }

    #upload-zone {
      border: 2px dashed #c7c7cc; border-radius: 16px; padding: 3rem;
      text-align: center; cursor: pointer; transition: all 0.2s;
      background: white; margin-bottom: 2rem;
    }
    #upload-zone:hover, #upload-zone.drag-over { border-color: #34c759; background: #f0fff4; }
    #upload-zone .icon { font-size: 3rem; margin-bottom: 1rem; }
    #upload-zone p { color: #6e6e73; margin-top: 0.5rem; font-size: 0.9rem; }
    #file-input { display: none; }

    /* Summary total */
    #summary { display: none; margin-bottom: 2rem; }
    .total-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
    .card { background: white; border-radius: 16px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card .label { font-size: 0.8rem; color: #6e6e73; text-transform: uppercase; letter-spacing: 0.05em; }
    .card .value { font-size: 2rem; font-weight: 700; margin-top: 0.5rem; }
    .card.ht .value { color: #1d1d1f; }
    .card.tva .value { color: #ff9500; }
    .card.ttc .value { color: #34c759; }

    /* Client cards */
    #clients { display: none; }
    .clients-grid { display: flex; flex-direction: column; gap: 1rem; }

    .client-card {
      background: white; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      overflow: hidden;
    }
    .client-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 1.5rem; cursor: pointer; user-select: none;
    }
    .client-header:hover { background: #fafafa; }
    .client-left { display: flex; align-items: center; gap: 1rem; }
    .client-name { font-size: 1rem; font-weight: 700; }
    .client-hours { font-size: 0.85rem; color: #6e6e73; }
    .forfait-badge { background: #fff3cd; color: #856404; border-radius: 6px; padding: 2px 8px; font-size: 0.72rem; font-weight: 600; }
    .client-right { display: flex; align-items: center; gap: 2rem; }
    .amount-block { text-align: right; }
    .amount-block .amt-label { font-size: 0.72rem; color: #6e6e73; text-transform: uppercase; }
    .amount-block .amt-value { font-size: 1.1rem; font-weight: 700; }
    .amt-ht { color: #1d1d1f; }
    .amt-ttc { color: #34c759; }
    .toggle-icon { color: #c7c7cc; font-size: 1rem; transition: transform 0.2s; }
    .toggle-icon.open { transform: rotate(180deg); }

    .client-tasks { display: none; border-top: 1px solid #f5f5f7; padding: 0.75rem 1.5rem; }
    .client-tasks.open { display: block; }
    .task-row { display: flex; justify-content: space-between; padding: 0.4rem 0; font-size: 0.85rem; border-bottom: 1px solid #f9f9f9; }
    .task-row:last-child { border-bottom: none; }
    .task-desc { color: #3a3a3c; flex: 1; padding-right: 1rem; }
    .task-dur { color: #6e6e73; font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* Rate editor */
    .rate-editor { display: flex; align-items: center; gap: 0.5rem; }
    .rate-input {
      width: 60px; padding: 0.2rem 0.4rem; border: 1px solid #d1d1d6;
      border-radius: 6px; font-size: 0.85rem; text-align: right;
    }
    .rate-label { font-size: 0.8rem; color: #6e6e73; }

    .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #e5e5ea; border-top-color: #34c759; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .fmt { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <a href="/" class="back-link">← Accueil</a>
    <img src="/static/logo.png" alt="Agence Symétrie Assistanat">
    <h1>Facturation Toggl <span>♥</span></h1>
  </header>

  <div class="container">
    <div id="upload-zone" onclick="document.getElementById('file-input').click()">
      <div class="icon">🧾</div>
      <strong>Déposez votre export Toggl Track PDF</strong>
      <p>Rapport Summary — calcul automatique par client</p>
      <input type="file" id="file-input" accept=".pdf">
    </div>

    <div id="summary">
      <div class="total-cards">
        <div class="card ht">
          <div class="label">Total HT</div>
          <div class="value fmt" id="total-ht">—</div>
        </div>
        <div class="card tva">
          <div class="label">TVA 20%</div>
          <div class="value fmt" id="total-tva">—</div>
        </div>
        <div class="card ttc">
          <div class="label">Total TTC</div>
          <div class="value fmt" id="total-ttc">—</div>
        </div>
      </div>
    </div>

    <div id="clients">
      <div class="clients-grid" id="clients-grid"></div>
    </div>
  </div>

  <script>
    let clientsData = [];

    const fmt = v => v.toFixed(2).replace('.', ',') + ' €';
    const fmtH = h => {
      const total = Math.round(h * 3600);
      const hh = Math.floor(total / 3600);
      const mm = Math.floor((total % 3600) / 60);
      return `${hh}h${mm.toString().padStart(2,'0')}`;
    };

    const uploadZone = document.getElementById('upload-zone');
    const fileInput = document.getElementById('file-input');

    uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
    uploadZone.addEventListener('drop', e => {
      e.preventDefault(); uploadZone.classList.remove('drag-over');
      if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => { if (fileInput.files[0]) uploadFile(fileInput.files[0]); });

    async function uploadFile(file) {
      uploadZone.innerHTML = `<div class="spinner"></div><p>Analyse du rapport Toggl…</p>`;
      const fd = new FormData();
      fd.append('file', file);
      const res = await fetch('/facturation/upload', { method: 'POST', body: fd });
      const data = await res.json();
      if (data.error) { alert(data.error); location.reload(); return; }
      clientsData = data.clients;
      render();
    }

    function computeTotals() {
      return clientsData.reduce((acc, c) => {
        const ht = c.billed_hours * c.rate;
        acc.ht += ht;
        acc.tva += ht * 0.20;
        acc.ttc += ht * 1.20;
        return acc;
      }, { ht: 0, tva: 0, ttc: 0 });
    }

    function render() {
      uploadZone.style.display = 'none';
      document.getElementById('summary').style.display = 'block';
      document.getElementById('clients').style.display = 'block';

      const totals = computeTotals();
      document.getElementById('total-ht').textContent = fmt(totals.ht);
      document.getElementById('total-tva').textContent = fmt(totals.tva);
      document.getElementById('total-ttc').textContent = fmt(totals.ttc);

      const grid = document.getElementById('clients-grid');
      grid.innerHTML = clientsData.map((c, i) => {
        const ht = c.billed_hours * c.rate;
        const ttc = ht * 1.20;
        const hoursLabel = c.is_forfait
          ? `Forfait 9h (réel : ${c.actual_duration})`
          : `${c.actual_duration} tracées → <strong>${c.billed_hours}h retenues</strong>`;

        return `
        <div class="client-card">
          <div class="client-header" onclick="toggleTasks(${i})">
            <div class="client-left">
              <div>
                <div class="client-name">${c.name}</div>
                <div class="client-hours">${hoursLabel}</div>
              </div>
              ${c.is_forfait ? '<span class="forfait-badge">Forfait mensuel</span>' : ''}
            </div>
            <div class="client-right">
              <div class="rate-editor" onclick="event.stopPropagation()">
                <input class="rate-input" type="number" value="${c.rate}" min="0" step="0.5"
                  onchange="updateRate(${i}, this.value)">
                <span class="rate-label">€/h HT</span>
              </div>
              <div class="amount-block">
                <div class="amt-label">HT</div>
                <div class="amt-value amt-ht fmt" id="ht-${i}">${fmt(ht)}</div>
              </div>
              <div class="amount-block">
                <div class="amt-label">TTC</div>
                <div class="amt-value amt-ttc fmt" id="ttc-${i}">${fmt(ttc)}</div>
              </div>
              <span class="toggle-icon" id="icon-${i}">▼</span>
            </div>
          </div>
          <div class="client-tasks" id="tasks-${i}">
            ${c.tasks.length ? c.tasks.map(t => `
              <div class="task-row">
                <span class="task-desc">${t.description}</span>
                <span class="task-dur">${t.duration}</span>
              </div>`).join('') : '<div style="color:#6e6e73;font-size:0.85rem;padding:0.5rem 0">Aucune tâche détaillée</div>'}
          </div>
        </div>`;
      }).join('');
    }

    function toggleTasks(i) {
      const tasks = document.getElementById(`tasks-${i}`);
      const icon = document.getElementById(`icon-${i}`);
      tasks.classList.toggle('open');
      icon.classList.toggle('open');
    }

    function updateRate(i, newRate) {
      clientsData[i].rate = parseFloat(newRate) || 0;
      const ht = clientsData[i].billed_hours * clientsData[i].rate;
      document.getElementById(`ht-${i}`).textContent = fmt(ht);
      document.getElementById(`ttc-${i}`).textContent = fmt(ht * 1.20);
      const totals = computeTotals();
      document.getElementById('total-ht').textContent = fmt(totals.ht);
      document.getElementById('total-tva').textContent = fmt(totals.tva);
      document.getElementById('total-ttc').textContent = fmt(totals.ttc);
    }
  </script>
</body>
</html>
